# kiln-timelapse's Moonraker part (Kiln OS includes it while the plugin is
# on). Other settings (camera, frame rate, parking, ...): Fluidd >
# Settings > Timelapse.
[timelapse]
# Videos: Fluidd's Timelapse tab (printer_data/timelapse)
output_path: /home/klipper/printer_data/timelapse/
# Frames on the data partition (printer_data is /data): /tmp is RAM
frame_path: /home/klipper/printer_data/timelapse_frames/
# Our ffmpeg (ffmpeg/, built from source by tools/build_ffmpeg.sh)
ffmpeg_binary_path: /data/ad5x/plugins/timelapse/ffmpeg/ffmpeg
snapshoturl: http://127.0.0.1/webcam/?action=snapshot

# Updates from Fluidd (Settings > Software Updates); Moonraker uses an
# update after the next reboot.
[update_manager kiln-timelapse]
type: git_repo
path: /data/ad5x/plugins/timelapse
origin: https://github.com/djvalic/kiln-timelapse.git
primary_branch: main
is_system_service: False
